<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif">
  <rect width="900" height="460" rx="16" fill="#14171a"/>
  <text x="32" y="46" fill="#8b95a0" font-size="13" letter-spacing="2" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">KOREAN-READABLE-REPORTS</text>
  <text x="32" y="80" fill="#eceef0" font-size="24" font-weight="700">같은 내용, 팀이 끝까지 읽는 보고서.</text>

  <!-- BEFORE -->
  <rect x="32" y="108" width="836" height="132" rx="10" fill="#1c1416" stroke="#c23b3b" stroke-opacity="0.5"/>
  <text x="48" y="134" fill="#e06a6a" font-size="12.5" font-weight="700" letter-spacing="1">✗ BEFORE — 에이전트가 기본으로 쓰는 문장</text>
  <text x="48" y="168" fill="#c9d1d9" font-size="14.5">parseInput()이 중첩 스캔으로 인해 O(n²)임 (utils.js:88).</text>
  <text x="48" y="193" fill="#c9d1d9" font-size="14.5">리스트 크기에 따라 지연 증가 → UI 버벅임.</text>
  <text x="48" y="224" fill="#6b7480" font-size="12.5" font-style="italic">풀지 않은 용어 · 본문 속 코드 위치 · 번역투 · 서술어 없는 단편</text>

  <!-- AFTER -->
  <rect x="32" y="256" width="836" height="148" rx="10" fill="#101f17" stroke="#2f8f5b" stroke-opacity="0.55"/>
  <text x="48" y="282" fill="#5cc08a" font-size="12.5" font-weight="700" letter-spacing="1">✓ AFTER — 같은 사실, 이 스킬 적용</text>
  <text x="48" y="318" fill="#eceef0" font-size="16" font-weight="700">목록이 길어질수록 입력 처리가 느려집니다.</text>
  <text x="48" y="346" fill="#c9d1d9" font-size="15">항목 하나마다 목록 전체를 다시 훑어서, 긴 목록에서는 화면이 끊깁니다.</text>
  <text x="48" y="380" fill="#6b7480" font-size="13" font-style="italic">(코드 위치는 아래 근거에)</text>

  <text x="32" y="438" fill="#8b95a0" font-size="13">내용은 깊게, 읽기는 쉽게 — 한국어 보고서를 위한 에이전트 스킬.</text>
</svg>
